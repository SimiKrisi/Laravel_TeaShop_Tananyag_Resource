info:
  name: Create New Tea
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/teas"
  body:
    type: json
    data: |-
      {
        "name": "Black Tea2",
        "image_path": "images\/black_tea.jpg",
        "price": 29.99,
        "specification": "Premium black tea leaves.",
        "stock": 50,
        "discount": 3,
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
